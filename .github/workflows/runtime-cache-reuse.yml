name: Runtime cache reuse check
on:
  push:
    tags: ['test/runtime-cache/*']
permissions:
  contents: read
jobs:
  verify-runtime-cache:
    if: github.event_name == 'push' && github.repository == 'JohnRoosevelt/uniopc-desktop-builds' && github.actor == 'JohnRoosevelt' && github.triggering_actor == 'JohnRoosevelt'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: node scripts/public-release-guard.mjs runtime-probe
      - id: runtime-key
        run: node scripts/windows-runtime-cache.mjs key
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: runtime-cache
        with:
          key: ${{ steps.runtime-key.outputs.key }}
          path: |
            src-tauri/resources/uniopc-engine-runtime/uniopc-engine-runtime-win32-x64.tar.gz
            src-tauri/resources/uniopc-engine-runtime/uniopc-engine-runtime.catalog.json
      - name: Require exact V2 hit without installing or rebuilding
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          echo 'Exact main-branch V2 runtime cache is missing' >&2
          exit 1
      - name: Verify hash, contract and whitelabel from tag-restored bytes
        run: node scripts/windows-runtime-cache.mjs verify
