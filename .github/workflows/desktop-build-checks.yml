name: Desktop Build Checks
on:
  workflow_call:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: node scripts/public-release-guard.mjs candidate
      - run: node scripts/check-updater-signing-keys.mjs --platforms windows
      - run: node --input-type=module -e 'import { readDesktopReleaseVersion } from "./scripts/prepare-desktop-updater-release.mjs"; console.log(await readDesktopReleaseVersion())'
