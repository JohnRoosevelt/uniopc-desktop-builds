name: Desktop Build Windows
on:
  workflow_call:
    secrets:
      TAURI_SIGNING_PRIVATE_KEY_WINDOWS:
        required: true
permissions:
  contents: read
jobs:
  checks:
    if: github.event_name == 'push' && github.repository == 'JohnRoosevelt/uniopc-desktop-builds' && github.actor == 'JohnRoosevelt' && github.triggering_actor == 'JohnRoosevelt'
    uses: ./.github/workflows/desktop-build-checks.yml
  prepare-openclaw-runtime-windows:
    needs: checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - id: runtime-key
        run: node scripts/windows-runtime-cache.mjs key
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: runtime-cache
        with:
          key: ${{ steps.runtime-key.outputs.key }}
          path: |
            src-tauri/resources/uniopc-engine-runtime/uniopc-engine-runtime-win32-x64.tar.gz
            src-tauri/resources/uniopc-engine-runtime/uniopc-engine-runtime.catalog.json
      - name: Verify exact cache hit before installing any dependencies
        if: steps.runtime-cache.outputs.cache-hit == 'true'
        run: node scripts/windows-runtime-cache.mjs verify
      - name: Install builder dependencies only on cache miss
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: npm ci --legacy-peer-deps
      - name: Build runtime only on exact cache miss
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: node scripts/windows-runtime-cache.mjs build
      - name: Verify freshly built runtime hash, contract and whitelabel
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: node scripts/windows-runtime-cache.mjs verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          retention-days: 3
          compression-level: 0
          name: prepared-openclaw-runtime-win32-x64
          if-no-files-found: error
          path: |
            src-tauri/resources/uniopc-engine-runtime/uniopc-engine-runtime-win32-x64.tar.gz
            src-tauri/resources/uniopc-engine-runtime/uniopc-engine-runtime.catalog.json
  windows:
    needs: [checks, prepare-openclaw-runtime-windows]
    runs-on: windows-latest
    environment: desktop-signing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: npm ci --legacy-peer-deps
      - name: Verify Windows updater key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_WINDOWS }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: node scripts/verify-updater-signing-key.mjs windows
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri -> target
          shared-key: desktop-Windows-windows
          cache-on-failure: true
          cache-bin: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: prepared-openclaw-runtime-win32-x64
          path: .prepared-runtime
      - name: Install Perl required by vendored OpenSSL
        shell: pwsh
        run: |
          $perl = 'C:\Strawberry\perl\bin\perl.exe'
          if (-not (Test-Path $perl)) { choco install strawberryperl --no-progress --yes }
          & $perl -MLocale::Maketext::Simple -e 'print "Perl ready\n"'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content -Path $env:GITHUB_PATH -Value 'C:\Strawberry\perl\bin'
      - name: Build and sign Windows updater from verified runtime snapshot
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_WINDOWS }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
          UNIOPC_PREPARED_OPENCLAW_RUNTIME_DIR: ${{ github.workspace }}/.prepared-runtime
        run: |
          : > .env.release
          export PATH="/c/Strawberry/perl/bin:$PATH"
          command -v perl
          perl -MLocale::Maketext::Simple -e 'print "Build Perl ready\n"'
          npm run build:release -- --target x86_64-pc-windows-msvc
      - name: Record signed build provenance
        run: >-
          node scripts/desktop-release-candidate.mjs evidence --target windows --arch x86_64
          --runtime-dir .prepared-runtime --bundle-dir src-tauri/target/x86_64-pc-windows-msvc/release/bundle
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          retention-days: 3
          compression-level: 0
          name: desktop-release-windows-x86_64-${{ github.run_attempt }}
          if-no-files-found: error
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle
